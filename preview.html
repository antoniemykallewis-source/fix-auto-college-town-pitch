<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><title>Fix Auto layout preview</title><style>body{margin:0;background:#ddd}iframe{border:0;transform-origin:top left;display:block}</style></head><body><iframe title="Deck preview"></iframe><script>const q=new URLSearchParams(location.search),w=Number(q.get('w'))||1440,h=Number(q.get('h'))||900,n=Number(q.get('n'))||1,f=document.querySelector('iframe');f.width=w;f.height=h;f.style.transform='scale('+Math.min(1,1120/w,700/h)+')';f.src='index.html#'+n;</script></body></html>
